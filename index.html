<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Барбершоп «Борода»</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #1a1a1a; color: #fff; text-align: center; }
    header { padding: 60px 20px; background: #000; }
    h1 { margin: 0; font-size: 32px; }
    section { padding: 30px 20px; }
    .price { max-width: 320px; margin: 0 auto; text-align: left; }
    .price p { display: flex; justify-content: space-between; border-bottom: 1px solid #444; padding: 8px 0; }
    a.btn { display: inline-block; background: #c9a24d; color: #000; padding: 14px 28px; border-radius: 8px; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>Барбершоп «Борода»</h1>
    <p>Стрижки и уход за бородой</p>
  </header>
  <section>
    <h2>Цены</h2>
    <div class="price">
      <p><span>Стрижка</span><span>1000 ₽</span></p>
      <p><span>Борода</span><span>700 ₽</span></p>
      <p><span>Стрижка + борода</span><span>1500 ₽</span></p>
    </div>
  </section>
  <section>
    <a class="btn" href="https://t.me/username">Записаться</a>
  </section>
</body>
</html>
